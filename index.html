<style>
  :root {
    --bg: #0f1419;
    --bg-2: #12181f;
    --panel: #171d24;
    --panel-2: #1d252e;
    --line: #2a3440;
    --text: #e8eef4;
    --muted: #8b9aab;
    --faint: #5d6b7a;
    --ok: #3dd68c;
    --ok-bg: rgba(61,214,140,.12);
    --warn: #f5a524;
    --zero: #ff8b72;
    --zero-bg: rgba(255,107,107,.10);
    --emp: #9ad0c2;
    --emp-bg: rgba(154,208,194,.12);
    --list: #b4b7ff;
    --list-bg: rgba(91,95,199,.16);
    --shadow: 0 12px 40px rgba(0,0,0,.35);
    --chip-on: #243140;
    --chip-on-border: #4d6b8a;
    --link: #7aa2f7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif; }
  body { min-height: 100vh; }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 36px 22px 72px; }

  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .kicker { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); font-weight: 650; margin: 0 0 8px; }
  h1 { font-size: 28px; font-weight: 650; letter-spacing: -0.03em; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.45; }
  .scan-pill { background: linear-gradient(180deg, var(--panel), var(--panel-2)); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow); min-width: 210px; }
  .scan-pill .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .scan-pill .val { font-size: 14px; font-weight: 600; }

  .windows, .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .filters { margin-bottom: 18px; }
  .win, .chip {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text);
    border-radius: 999px;
    padding: 9px 16px;
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }
  .chip { padding: 7px 13px; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .win:hover, .chip:hover { border-color: #3d4d5e; }
  .win.active, .chip.active { border-color: var(--chip-on-border); background: var(--chip-on); }
  .win .range { color: var(--muted); font-weight: 500; margin-left: 6px; font-size: 12.5px; }
  .filter-label { width: 100%; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 650; margin: 2px 0 0; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 0 0 6px; }
  .stat { background: linear-gradient(180deg, var(--panel), var(--panel-2)); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); }
  .stat .n { font-size: 34px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; margin: 0 0 8px; }
  .stat .n.zero { color: var(--zero); }
  .stat .l { font-size: 13px; color: var(--muted); }
  .stat .hint { font-size: 12px; color: var(--faint); margin-top: 6px; }
  .stat.co { border-top: 3px solid var(--line); }

  .settings {
    margin: 22px 0 4px;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px 14px;
    box-shadow: var(--shadow);
  }
  .settings h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0 0 12px; }
  .set-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 16px; margin-bottom: 14px; }
  .set-item .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 650; margin-bottom: 4px; }
  .set-item .v { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .set-item .v span { color: var(--muted); font-weight: 500; }
  .co-list { display: flex; flex-direction: column; gap: 10px; }
  .co-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; background: rgba(0,0,0,.18); border: 1px solid var(--line); border-radius: 12px; }
  .co-row .swatch { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; flex: 0 0 auto; }
  .co-row .name { font-size: 14px; font-weight: 650; }
  .co-row .meta { font-size: 12.5px; color: var(--muted); line-height: 1.45; margin-top: 2px; }
  .settings .hint { font-size: 12.5px; color: var(--faint); margin: 12px 0 0; line-height: 1.5; }

  .section { margin-top: 28px; }
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 10px; }
  .section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0; }
  .section-head .n { font-size: 12px; color: var(--faint); }

  .empty { background: var(--panel); border: 1px dashed #334050; border-radius: 14px; padding: 22px 20px; }
  .empty .t { font-size: 15.5px; font-weight: 600; margin: 0 0 6px; }
  .empty .d { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px 14px; border-left: 3px solid var(--line); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag { font-size: 11px; font-weight: 650; letter-spacing: .02em; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
  .src-emp { background: var(--emp-bg); color: var(--emp); }
  .src-list { background: var(--list-bg); color: var(--list); }
  .title { font-size: 16px; font-weight: 650; margin: 0 0 4px; letter-spacing: -0.015em; line-height: 1.3; }
  .who { font-size: 13px; color: var(--muted); margin: 0 0 10px; line-height: 1.45; }
  .who .date { color: var(--text); }
  .roles { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
  .role { font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 4px 8px; }
  .facts { display: grid; gap: 4px; font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .facts span b { color: var(--text); font-weight: 600; }
  .excerpt { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0 0 10px; }
  .notes { font-size: 12px; color: var(--faint); line-height: 1.45; margin: 0 0 10px; }
  .card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .src-link { font-size: 13px; font-weight: 600; }

  footer.page { margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  footer.page p { margin: 0 0 6px; }

  @media (max-width: 800px) {
    .set-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 720px) {
    .wrap { padding: 24px 16px 56px; }
    h1 { font-size: 24px; }
    .stat .n { font-size: 30px; }
    header.top { align-items: flex-start; }
    .scan-pill { width: 100%; }
    .win .range { display: block; margin: 3px 0 0; }
    .set-grid { grid-template-columns: 1fr; }
    .co-row { flex-direction: row; }
  }
</style>
</head>

const PALETTE = [
  { accent: "#7aa2f7", bg: "rgba(122,162,247,.14)", text: "#a9c4ff" },
  { accent: "#d4b06a", bg: "rgba(212,176,106,.14)", text: "#e8d09a" },
  { accent: "#9ad0c2", bg: "rgba(154,208,194,.14)", text: "#b8e6d8" },
  { accent: "#e08bb8", bg: "rgba(224,139,184,.14)", text: "#f0b0d0" },
  { accent: "#b4b7ff", bg: "rgba(180,183,255,.14)", text: "#c8caff" },
  { accent: "#f5a524", bg: "rgba(245,165,36,.14)", text: "#ffc96b" },
  { accent: "#7dd3a8", bg: "rgba(125,211,168,.14)", text: "#a8e6c4" },
  { accent: "#ff8b72", bg: "rgba(255,139,114,.14)", text: "#ffb4a4" }
];

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function slugify(name) {
  return String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function formatDate(raw) {
  if (!raw) return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
  if (m) return MONTHS[+m[2] - 1] + " " + (+m[3]) + ", " + m[1];
  return raw;
}

function formatShort(raw) {
  if (!raw) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
  if (m) return MONTHS[+m[2] - 1] + " " + (+m[3]);
  return raw;
}

function parseYMD(raw) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
  if (!m) return null;
  return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3]));
}

function addDays(raw, delta) {
  const dt = parseYMD(raw);
  if (!dt) return raw;
  dt.setUTCDate(dt.getUTCDate() + delta);
  return dt.toISOString().slice(0, 10);
}

function nyToday() {
  return new Intl.DateTimeFormat("en-CA", {
    timeZone: "America/New_York",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(new Date());
}

function resolvedEndDate() {
  const cfg = CONFIG.end_date;
  if (!cfg || cfg === "today") return DATA.end_date || nyToday();
  return cfg;
}

function companies() {
  return (CONFIG.companies || []).map((c, i) => ({
    name: c.name,
    short: c.short || c.name,
    aliases: c.aliases || [],
    linkedin: c.linkedin || "",
    keyword: c.keyword,
    keywords: c.keywords || [],
    keyword_note: c.keyword_note || "",
    location: c.location,
    locations: c.locations || [],
    location_note: c.location_note || "",
    key: slugify(c.name),
    color: PALETTE[i % PALETTE.length],
    idx: i
  }));
}

function companyByKey(key) {
  return companies().find(c => c.key === key) || null;
}

function colorFor(key) {
  const c = companyByKey(key);
  return (c && c.color) || PALETTE[0];
}

function windowDaysList() {
  const list = CONFIG.windows_days && CONFIG.windows_days.length
    ? CONFIG.windows_days.slice()
    : [7, 15];
  return list.map(Number);
}

function windowMeta(days) {
  const end = resolvedEndDate();
  const start = addDays(end, -days);
  const cached = DATA.windows && (DATA.windows[String(days)] || DATA.windows[days + "d"]);
  const range_label = (cached && cached.range_label)
    ? cached.range_label
    : (formatShort(start) + "–" + (+end.slice(8)) + ", " + end.slice(0, 4));
  return {
    days: days,
    id: days + "d",
    label: days + " days",
    start: (cached && cached.start) || start,
    end: (cached && cached.end) || end,
    range_label: range_label
  };
}

function allHits() {
  if (Array.isArray(DATA.hits) && DATA.hits.length) return DATA.hits;
  const out = [];
  const wins = DATA.windows || {};
  Object.keys(wins).forEach(k => {
    const w = wins[k];
    (w.employee_posts || []).concat(w.company_posts || []).concat(w.official_listings || []).forEach(h => out.push(h));
  });
  const seen = new Set();
  return out.filter(h => {
    const id = (h.post_url || "") + "|" + (h.author_name || "") + "|" + (h.post_date || "");
    if (seen.has(id)) return false;
    seen.add(id);
    return true;
  });
}

function hitsInWindow(days) {
  const w = windowMeta(days);
  return allHits().filter(h => {
    const d = h.post_date || "";
    return d >= w.start && d <= w.end;
  });
}

function sourceLabel(t) {
  if (t === "employee_post") return "Employee post";
  if (t === "company_post") return "Company post";
  return "Official listing";
}

function isListing(h) {
  return h.source_type === "job_listing";
}

let windowDays = CONFIG.default_window_days || windowDaysList()[0] || 7;
let companyFilter = "all";

function filteredHits() {
  return hitsInWindow(windowDays).filter(h => companyFilter === "all" || h.company_key === companyFilter);
}

function filterLabel() {
  if (companyFilter === "all") return null;
  const c = companyByKey(companyFilter);
  return c ? c.name : companyFilter;
}

function emptyHTML(kind) {
  const co = filterLabel();
  const w = windowMeta(windowDays);
  const title = co
    ? "No matching posts for " + co + " in this window"
    : "No matching posts in this window";
  const detail = co
    ? "No " + kind + " for " + co + " between " + w.range_label + "."
    : "No " + kind + " for the selected companies between " + w.range_label + ".";
  return (
    '<div class="empty">' +
      '<p class="t">' + esc(title) + "</p>" +
      '<p class="d">' + esc(detail) + "</p>" +
    "</div>"
  );
}

function cardHTML(item) {
  const roles = (item.roles || []).filter(Boolean);
  const headline = roles.length ? roles.join(" · ") : (item.author_name || "Untitled");
  const date = formatDate(item.post_date);
  const whoBits = [];
  if (item.author_name) whoBits.push(esc(item.author_name));
  if (item.author_title) whoBits.push(esc(item.author_title));
  const facts = [];
  if (item.location) facts.push("<span><b>Location</b> " + esc(item.location) + "</span>");
  if (item.experience) facts.push("<span><b>Experience</b> " + esc(item.experience) + "</span>");
  if (item.apply_info) facts.push("<span><b>Apply</b> " + esc(item.apply_info) + "</span>");
  const color = colorFor(item.company_key);
  const badge = item.company_badge || (companyByKey(item.company_key) || {}).short || item.author_company || item.company_key;
  const tags = [
    '<span class="tag" style="background:' + color.bg + ";color:" + color.text + '">' + esc(badge) + "</span>",
    '<span class="tag ' + (isListing(item) ? "src-list" : "src-emp") + '">' + sourceLabel(item.source_type) + "</span>"
  ];
  return (
    '<article class="card" style="border-left-color:' + color.accent + '">' +
      '<div class="badges">' + tags.join("") + "</div>" +
      '<h3 class="title">' + esc(headline) + "</h3>" +
      '<p class="who">' + whoBits.join(" · ") + (date ? ' · <span class="date">' + esc(date) + "</span>" : "") + "</p>" +
      (roles.length > 1 ? '<div class="roles">' + roles.map(r => '<span class="role">' + esc(r) + "</span>").join("") + "</div>" : "") +
      (facts.length ? '<div class="facts">' + facts.join("") + "</div>" : "") +
      (item.post_text_excerpt ? '<p class="excerpt">' + esc(item.post_text_excerpt) + "</p>" : "") +
      (item.notes ? '<p class="notes">' + esc(item.notes) + "</p>" : "") +
      '<div class="card-foot">' +
        (item.post_url ? '<a class="src-link" href="' + esc(item.post_url) + '" target="_blank" rel="noopener">Open source ↗</a>' : "<span></span>") +
      "</div>" +
    "</article>"
  );
}


function listingCardHTML(item) {
  const roles = (item.roles || []).filter(Boolean);
  const headline = roles.length ? roles.join(" · ") : (item.author_name || "Untitled");
  const date = formatDate(item.post_date);
  const color = colorFor(item.company_key);
  const badge = item.company_badge || (companyByKey(item.company_key) || {}).short || item.author_company || item.company_key;
  const loc = item.location || "";
  return (
    '<article class="card" style="border-left-color:' + color.accent + '">' +
      '<div class="badges">' +
        '<span class="tag" style="background:' + color.bg + ";color:" + color.text + '">' + esc(badge) + "</span>" +
        '<span class="tag src-list">Official listing</span>' +
      "</div>" +
      '<h3 class="title">' + esc(headline) + "</h3>" +
      '<p class="who">' + (loc ? esc(loc) : "") + (date ? (loc ? " · " : "") + '<span class="date">' + esc(date) + "</span>" : "") + "</p>" +
      '<div class="card-foot">' +
        (item.post_url ? '<a class="src-link" href="' + esc(item.post_url) + '" target="_blank" rel="noopener">Open source ↗</a>' : "<span></span>") +
      "</div>" +
    "</article>"
  );
}

function renderHeader() {
  const w = windowMeta(windowDays);
  const names = companies().map(c => c.name);
  const shorts = companies().map(c => c.short);
  document.getElementById("subtitle").textContent =
    names.join(" · ") + " · " + w.label + " · " + w.range_label;
  document.getElementById("scanPill").textContent =
    (CONFIG.keyword || DATA.keyword || "Salesforce") + " · " + shorts.join(" · ");
  document.title = (DATA.title || "Salesforce hiring radar") + " · " + shorts.join(" & ") + " · " + w.label;
}

function renderWindows() {
  document.getElementById("windows").innerHTML = windowDaysList().map(days => {
    const w = windowMeta(days);
    return '<button class="win' + (windowDays === days ? " active" : "") + '" data-days="' + days + '" role="tab" aria-selected="' + (windowDays === days) + '">' +
      esc(w.label) + '<span class="range">' + esc(w.range_label) + "</span></button>";
  }).join("");
  document.querySelectorAll(".win").forEach(btn => {
    btn.addEventListener("click", () => {
      windowDays = Number(btn.dataset.days);
      render();
    });
  });
}

function renderFilters() {
  const all = '<button class="chip' + (companyFilter === "all" ? " active" : "") + '" data-key="all">All companies</button>';
  const chips = companies().map(c => {
    const on = companyFilter === c.key;
    return '<button class="chip' + (on ? " active" : "") + '" data-key="' + esc(c.key) + '" style="' +
      (on ? "border-color:" + c.color.accent : "") + '">' +
      '<span class="dot" style="background:' + c.color.accent + '"></span>' +
      esc(c.short) + "</button>";
  }).join("");
  document.getElementById("filters").innerHTML = all + chips;
  document.querySelectorAll("#filters .chip").forEach(btn => {
    btn.addEventListener("click", () => {
      companyFilter = btn.dataset.key;
      render();
    });
  });
}

function renderStats() {
  const w = windowMeta(windowDays);
  const hits = hitsInWindow(windowDays);
  const view = companyFilter === "all" ? hits : hits.filter(h => h.company_key === companyFilter);
  const posts = view.filter(h => !isListing(h));
  const listings = view.filter(isListing);
  const cards = [
    { n: posts.length, l: "Employee / company posts", h: "Verified hiring posts · " + w.range_label, color: null },
    { n: listings.length, l: "Official listings", h: "Dated clearly inside " + w.range_label, color: null }
  ];
  companies().forEach(c => {
    const n = hits.filter(h => h.company_key === c.key).length;
    cards.push({
      n: n,
      l: c.name,
      h: (c.aliases.length ? "Also " + c.aliases.join(", ") : "In the active window"),
      color: c.color
    });
  });
  document.getElementById("stats").innerHTML = cards.map(s =>
    '<div class="stat' + (s.color ? " co" : "") + '"' + (s.color ? ' style="border-top-color:' + s.color.accent + '"' : "") + ">" +
      '<div class="n' + (s.n === 0 ? " zero" : "") + '"' + (s.color && s.n ? ' style="color:' + s.color.accent + '"' : "") + ">" + s.n + "</div>" +
      '<div class="l">' + esc(s.l) + "</div>" +
      '<div class="hint">' + esc(s.h) + "</div>" +
    "</div>"
  ).join("");
}

function companyRule(c) {
  let kw;
  if (c.keyword == null && c.keyword_note) kw = c.keyword_note;
  else if (c.keyword) kw = c.keyword + (c.keyword_note ? " — " + c.keyword_note : "");
  else kw = CONFIG.keyword || "Salesforce";
  let loc;
  if (c.locations && c.locations.length) loc = c.locations.join(", ");
  else if (c.location) loc = c.location;
  else loc = "any location";
  if (c.location_note) loc += " — " + c.location_note;
  return { keyword: kw, location: loc };
}

function renderSettings() {
  const endCfg = CONFIG.end_date || "today";
  const resolved = resolvedEndDate();
  const endText = endCfg === "today"
    ? 'today <span>(America/New_York → ' + esc(DATA.end_date_display || formatDate(resolved)) + ")</span>"
    : esc(endCfg);
  const wins = windowDaysList();
  const def = CONFIG.default_window_days || wins[0];
  const winText = wins.map(d => d + "d").join(" · ") + " <span>(default " + def + "d)</span>";
  const rows = companies().map(c => {
    const rule = companyRule(c);
    const aka = c.aliases.length ? "aka " + c.aliases.join(", ") : "no aliases";
    const link = c.linkedin
      ? ' · <a href="' + esc(c.linkedin) + '" target="_blank" rel="noopener">' + esc(c.linkedin.replace(/^https?:\/\//, "")) + "</a>"
      : "";
    return (
      '<div class="co-row">' +
        '<span class="swatch" style="background:' + c.color.accent + '"></span>' +
        "<div>" +
          '<div class="name">' + esc(c.short) + " · " + esc(c.name) + "</div>" +
          '<div class="meta"><b>Keyword</b> ' + esc(rule.keyword) + " · <b>Location</b> " + esc(rule.location) + "</div>" +
          '<div class="meta">' + esc(aka) + link + "</div>" +
        "</div>" +
      "</div>"
    );
  }).join("");
  document.getElementById("settings").innerHTML =
    "<h2>Scan settings</h2>" +
    '<div class="set-grid">' +
      '<div class="set-item"><div class="k">Keyword</div><div class="v">' + esc(CONFIG.keyword || "Salesforce") + "</div></div>" +
      '<div class="set-item"><div class="k">Windows</div><div class="v">' + winText + "</div></div>" +
      '<div class="set-item"><div class="k">End date</div><div class="v">' + endText + "</div></div>" +
    "</div>" +
    '<div class="co-list">' + rows + "</div>" +
    '<p class="hint">Anyone can change companies, add a company, change the keyword, or add a window in <b>salesforce-hiring-config.json</b>. The next scan picks it up. Per-company keyword and location rules below are what this scan used.</p>';
}

function renderBoard() {
  const w = windowMeta(windowDays);
  const hits = filteredHits();
  const posts = hits.filter(h => !isListing(h));
  const listings = hits.filter(isListing);
  let html = "";
  html +=
    '<section class="section">' +
      '<div class="section-head"><h2>Employee &amp; company posts</h2><span class="n">' + posts.length + " · " + esc(w.range_label) + "</span></div>" +
      (posts.length ? '<div class="list">' + posts.map(cardHTML).join("") + "</div>" : emptyHTML("employee or company posts")) +
    "</section>";
  html +=
    '<section class="section">' +
      '<div class="section-head"><h2>Official listings</h2><span class="n">' + listings.length + " · " + esc(w.range_label) + "</span></div>" +
      (listings.length ? '<div class="list">' + listings.map(listingCardHTML).join("") + "</div>" : emptyHTML("official listings")) +
    "</section>";
  document.getElementById("board").innerHTML = html;
}

function renderFooter() {
  const w = windowMeta(windowDays);
  const hits = hitsInWindow(windowDays);
  const zeros = companies().filter(c => hits.filter(h => h.company_key === c.key).length === 0);
  const notes = [
    (DATA.scanned_at_display || "Aug 17, 2026, 10:00 PM ET") + ". 30-day window (" + w.range_label + "). Config-driven.",
    zeros.length ? zeros.map(c => c.short).join(", ") + ": 0 matching posts in this window." : "All tracked companies have at least one hit in this window.",
    "Companies, per-company keyword/location rules, and date windows are set in salesforce-hiring-config.json.",
    "Sources used: linkedin-web-scan-30d.json (Persistent), acuity-india-web-scan-30d.json, ciklum-web-scan-30d.json, carrier-india-sf-scan-30d.json, randstad-blr-sf-scan-30d.json. Public web index; login-walled posts may be missing. No invented posts."
  ];
  document.getElementById("footer").innerHTML = notes.map(n => "<p>" + esc(n) + "</p>").join("");
}

function render() {
  renderHeader();
  renderWindows();
  renderFilters();
  renderStats();
  renderSettings();
  renderBoard();
  renderFooter();
}

render();
</script>
</body>
</html>
